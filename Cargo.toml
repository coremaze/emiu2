[workspace]
resolver = "2"
members = ["core", "dev", "desktop", "netplay", "server"]

[workspace.dependencies]
emiu2 = { path = "core" }
emiu2-netplay = { path = "netplay" }
emiu2-relay = { path = "server" }
miuchiz-reborn-paths = { git = "https://github.com/coremaze/Miuchiz-Reborn-Paths" }
cpal = "0.15.3"

# An unoptimized machine core can't reach the Miuchiz's 8M CPU cycles per
# second, which turns debug builds of the frontends into slow motion.
# Optimizing just the core keeps `cargo run` usable without hurting the
# edit-compile cycle of the frontends themselves.
[profile.dev.package.emiu2]
opt-level = 2
