<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emiu2</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #emulator-canvas { 
            /* Fixed aspect ratio of 98:67 */
            aspect-ratio: 98/67;
            /* Scale to fit width while maintaining aspect ratio */
            width: min(50em, 100vw, calc(50em * 98/67));
            height: auto;
            /* Center the canvas */
            display: block;
            margin: 0 auto;
            /* Ensure nearest neighbor scaling */
            image-rendering: pixelated;
            image-rendering: crisp-edges; /* Firefox fallback */
            background: radial-gradient(circle at center, #283e69 0%, #0a1525 100%);
        }
        #upload-container { padding: 10px; background: #f0f0f0; }
        #pc-display { padding: 10px; background: #ddd; font-size: 20px; }
        #controls {
            display: grid;
            grid-template-areas: 
                "screen-ul  up    screen-ur  menu"
                "left       .     right      action"
                "screen-ll  down  screen-lr  ."
                "power      .     mute       .";
            grid-gap: 10px;
            width: 350px;
            margin: 20px auto;
        }
        #controls button {
            padding: 10px;
            font-size: 16px;
            user-select: none;
            -webkit-user-select: none;
        }
        #menu-action {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
        }
        #menu-action button {
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: relative;
        }
        #canvas-container #emiu2-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            height: 50%;
            animation: rotation 60s infinite linear;
        }
        @keyframes rotation {
            from { transform: translate(-50%, -50%) rotate(360deg); }
            to { transform: translate(-50%, -50%) rotate(0deg); }
        }
        #canvas-container #emiu2-svg.exit {
            animation: accelerateExit 1s forwards ease-in-out;
        }
        @keyframes accelerateExit {
            from { transform: translate(-50%, -50%) rotate(720deg); }
            to { transform: translate(-50%, -200%) rotate(0deg); }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
         <canvas id="emulator-canvas"></canvas>
         <img src="emiu2.svg" alt="Emiu2 Logo" id="emiu2-svg">
    </div>
    <div id="upload-container">
        <input type="file" id="otp-input" />
        <input type="file" id="flash-input" />
        <button id="start-button">Start Emulator</button>
    </div>
    <div id="controls">
        <button id="up" style="grid-area: up;">Up</button>
        <button id="left" style="grid-area: left;">Left</button>
        <button id="right" style="grid-area: right;">Right</button>
        <button id="down" style="grid-area: down;">Down</button>
        <button id="screen-ul" style="grid-area: screen-ul;">Screen UL</button>
        <button id="screen-ur" style="grid-area: screen-ur;">Screen UR</button>
        <button id="screen-ll" style="grid-area: screen-ll;">Screen LL</button>
        <button id="screen-lr" style="grid-area: screen-lr;">Screen LR</button>
        <button id="menu" style="grid-area: menu;">Menu</button>
        <button id="action" style="grid-area: action;">Action</button>
        <button id="power" style="grid-area: power;">Power</button>
        <button id="mute" style="grid-area: mute;">Mute</button>
    </div>
    <script type="module">
        import init, { start_emulator_with_files, set_button_state, get_button_state } from '/pkg/emiu2.js';
        await init();


        function update_button_colors(buttons) {
            for (const [elementId, buttonState] of Object.entries(buttons)) {
                const element = document.getElementById(elementId);
                element.style.backgroundColor = get_button_state(buttonState) ? 'lightgreen' : 'lightgray';
            }
        }

        async function run() {
            const buttons = {
                'up': 'up',
                'down': 'down', 
                'left': 'left',
                'right': 'right',
                'menu': 'menu',
                'action': 'action',
                'power': 'power',
                'mute': 'mute',
                'screen-ul': 'screen-top-left',
                'screen-ur': 'screen-top-right',
                'screen-ll': 'screen-bottom-left',
                'screen-lr': 'screen-bottom-right'
            };

            // Map keyboard keys to button states
            const keyMap = {
                'ArrowUp': 'up',
                'ArrowDown': 'down',
                'ArrowLeft': 'left', 
                'ArrowRight': 'right',
                'm': 'menu',
                'M': 'menu',
                'a': 'action',
                'A': 'action',
                'p': 'power',
                'P': 'power',
                'u': 'mute',
                'U': 'mute'
            };
            update_button_colors(buttons);

            
            console.log('WASM module loaded');

            // Set initial canvas size
            const canvas = document.getElementById('emulator-canvas');
            canvas.width = 98;
            canvas.height = 67;

            document.getElementById('start-button').addEventListener('click', () => {
                const otpFileInput = document.getElementById('otp-input');
                const flashFileInput = document.getElementById('flash-input');

                if (otpFileInput.files.length === 0 || flashFileInput.files.length === 0) {
                    alert('Please select both OTP and flash files.');
                    return;
                }

                const otpFile = otpFileInput.files[0];
                const flashFile = flashFileInput.files[0];
                const svg = document.getElementById('emiu2-svg');

                // Use the Web Animations API to get the current time of the CSS rotation
                const animations = svg.getAnimations();
                const cssAnim = animations.length > 0 ? animations[0] : null;
                const duration = 60000; // 60 seconds duration of the rotation animation
                let currentAngle = 360;
                if (cssAnim && cssAnim.currentTime != null) {
                    // Compute the current angle based on the elapsed time in the CSS animation.
                    let t = cssAnim.currentTime;
                    currentAngle = 360 - ((t % duration) / duration * 360);
                }

                // Cancel any ongoing animations to freeze the current state
                svg.getAnimations().forEach(animation => animation.cancel());
                svg.style.transform = `translate(-50%, -50%) rotate(${currentAngle}deg)`;

                // Animate counterclockwise exit: subtract 720° from current angle
                const targetAngle = currentAngle - 720;
                const exitAnimation = svg.animate([
                    { transform: `translate(-50%, -50%) rotate(${currentAngle}deg)` },
                    { transform: `translate(-50%, -250%) rotate(${targetAngle}deg)` }
                ], {
                    duration: 1000,
                    easing: 'ease-in-out',
                    fill: 'forwards'
                });

                // const brightnessAnimation = canvas.animate([
                //     { background: "radial-gradient(circle at center, #283e69 0%, #0a1525 100%)" },
                //     { background: 'rgb(0, 0, 0)' }
                // ], { duration: 1000, easing: 'ease-in-out', fill: 'none' });

                exitAnimation.onfinish = async () => {
                    try {
                        const otpArrayBuffer = await otpFile.arrayBuffer();
                        const flashArrayBuffer = await flashFile.arrayBuffer();
                        const otpUint8 = new Uint8Array(otpArrayBuffer);
                        const flashUint8 = new Uint8Array(flashArrayBuffer);
                        start_emulator_with_files(otpUint8, flashUint8);
                    } catch (e) {
                        alert('Failed to start emulator: ' + e);
                        console.error(e);
                    }
                };



                
            });

 

            // Add keyboard event listeners
            document.addEventListener('keydown', (event) => {
                const buttonState = keyMap[event.key];
                if (buttonState) {
                    set_button_state(buttonState, true);
                    update_button_colors(buttons);
                }
            });

            document.addEventListener('keyup', (event) => {
                const buttonState = keyMap[event.key];
                if (buttonState) {
                    set_button_state(buttonState, false);
                    update_button_colors(buttons);
                }
            });

            // Add mouse/touch event listeners for on-screen buttons
            for (const [elementId, buttonState] of Object.entries(buttons)) {
                const element = document.getElementById(elementId);
                const on_events = ['mousedown', 'touchstart'];
                const off_events = ['mouseup', 'touchend'];
                
                on_events.forEach(eventType => {
                    element.addEventListener(eventType, () => {
                        set_button_state(buttonState, true);
                        update_button_colors(buttons);
                    });
                });
                off_events.forEach(eventType => {
                    element.addEventListener(eventType, () => {
                        set_button_state(buttonState, false);
                        update_button_colors(buttons);
                    });
                });
            }
        }

        run();
    </script>
</body>
</html>
