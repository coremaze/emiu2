# cargo-about configuration. Drives generation of THIRD-PARTY-LICENSES.html.
#
# `accepted` is the allowlist of SPDX licenses we are willing to ship in a
# distributed binary. cargo-about resolves OR-expressions to the FIRST accepted
# license in this list, and FAILS if any dependency offers no accepted license.
# That failure is the signal to review a newly added dependency.
#
# Ordering matters for dual/multi licenses: list the licenses we PREFER to claim
# first (permissive before weak-copyleft).

workarounds = ["ring"]

accepted = [
    # Permissive: preferred claims first.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "CC0-1.0",
    "WTFPL",
    "NCSA",
    # Fonts bundled by egui/epaint.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    # Weak / file-level copyleft. OK to distribute in binaries (no source-release
    # duty unless WE modify those crates' files, which we do not).
    "MPL-2.0",
    # Only ever reached via OR-dual crates (e.g. r-efi); never claimed standalone.
    "LGPL-2.1-or-later",
]
